name: Eve CI/CD Multi-Environment Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test -- --run

      - name: Build Application
        run: npm run build

      - name: Package Artifact
        run: |
          tar -czf dist-release.tar.gz dist/
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eve-release-${{ github.sha }}
          path: dist-release.tar.gz
          retention-days: 7

  deploy-staging:
    needs: verify-and-build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: eve-release-${{ github.sha }}

      - name: Extract Artifact
        run: tar -xzf dist-release.tar.gz

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Ensure Cloudflare Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create eve-virtual-assistant --production-branch main || true

      - name: Deploy to Cloudflare Pages (Staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist --project-name=eve-virtual-assistant --branch=staging

  deploy-production:
    needs: verify-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: eve-release-${{ github.sha }}

      - name: Extract Artifact
        run: tar -xzf dist-release.tar.gz

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Ensure Cloudflare Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages project create eve-virtual-assistant --production-branch main || true

      - name: Deploy to Cloudflare Pages (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist --project-name=eve-virtual-assistant --branch=main
